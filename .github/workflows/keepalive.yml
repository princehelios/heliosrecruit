# Keeps the Render free instance awake from OUTSIDE it, so a visitor never
# lands on a cold start / loading screen.
#
# Set the repo secret KEEPALIVE_URL to your Render URL, e.g.
#   https://resume-screener.onrender.com
# (Repo -> Settings -> Secrets and variables -> Actions -> New repository secret)
#
# Note: GitHub's scheduler is best-effort and can run late when their queue is
# busy, so this is the backup. The in-process pinger (keepalive.py) is the
# primary; this one exists to wake the service if it ever does fall asleep.
name: keep-render-awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (Render sleeps after 15)
  workflow_dispatch:          # lets you trigger a wake-up by hand

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEPALIVE_URL secret is not set - nothing to ping."
            exit 1
          fi
          # A sleeping instance takes up to ~60s to boot, so allow a long
          # timeout and retry rather than failing the run.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$URL/healthz" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is awake."
              exit 0
            fi
            sleep 15
          done
          echo "Could not reach $URL/healthz after 3 attempts."
          exit 1
